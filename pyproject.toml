[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raw-media-parser"
version = "0.1.0"
description = "Turn a video URL into a concise Markdown brief of its audio."
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.1.1",
    "groq>=0.11",
    "anthropic>=0.49",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
parse = "raw_media_parser.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put src/ on the import path so the suite runs straight from a clone, with no
# install step -- `pytest` works after `pip install -r requirements-dev.txt`.
pythonpath = ["src"]
