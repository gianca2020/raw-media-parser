<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>raw-media-parser</title>
<style>
  :root { --ink:#1a1a1a; --muted:#6b6b6b; --line:#e4e4e4; --accent:#2f6fdb; }
  * { box-sizing: border-box; }
  body {
    margin:0; background:#fff; color:var(--ink);
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:12vh 24px 64px;
  }
  form { width:100%; max-width:640px; display:flex; gap:8px; }
  input[type=url] {
    flex:1; padding:14px 16px; font-size:16px; color:var(--ink);
    border:1px solid var(--line); border-radius:8px; background:#fff;
  }
  input[type=url]:focus { outline:none; border-color:var(--accent); }
  button {
    padding:14px 22px; font-size:16px; font-weight:600; color:#fff;
    background:var(--accent); border:0; border-radius:8px; cursor:pointer;
  }
  button:disabled { background:#b9c8e4; cursor:default; }
  #progress { width:100%; max-width:640px; margin-top:28px; }
  .step { display:flex; gap:10px; align-items:baseline; color:var(--muted); padding:3px 0; }
  .step.active { color:var(--ink); font-weight:600; }
  .step.done { color:var(--ink); }
  .mark { width:1.2em; display:inline-block; }
  #error {
    width:100%; max-width:640px; margin-top:24px; padding:14px 16px;
    border:1px solid #f0c9c9; background:#fdf5f5; border-radius:8px; color:#8d2020;
  }
  #out { width:100%; max-width:720px; margin-top:40px; }
  #out h1 { font-size:1.6rem; margin:0 0 4px; }
  #out h2 { font-size:1.15rem; margin:1.6em 0 .4em; }
  #out ul { padding-left:1.3em; }
  #meta { color:var(--muted); font-size:.9rem; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:8px; }
  details { margin-top:40px; border-top:1px solid var(--line); padding-top:16px; }
  summary { cursor:pointer; color:var(--muted); }
  pre { white-space:pre-wrap; word-wrap:break-word; color:#333; font:14px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .hidden { display:none; }
</style>
</head>
<body>

<form id="form">
  <input id="url" type="url" placeholder="Paste a video URL…" required autofocus>
  <button id="go" type="submit">Parse</button>
</form>

<div id="progress" class="hidden"></div>
<div id="error" class="hidden"></div>
<div id="out" class="hidden"></div>

<script>
const STAGES = [
  ["fetch",     "Downloading audio"],
  ["transcribe","Transcribing"],
  ["summarize", "Summarizing with Claude"],
  ["write",     "Writing file"],
];
const $ = id => document.getElementById(id);
let timer = null;

// Minimal renderer for the few constructs the brief template emits: headings,
// bullets, and bold. Deliberately not a full Markdown parser -- no CDN, no deps.
function renderMarkdown(md) {
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const out = [];
  let inList = false;
  for (const raw of md.split("\n")) {
    const line = esc(raw);
    const bullet = line.match(/^\s*[-*]\s+(.*)$/);
    if (bullet) {
      if (!inList) { out.push("<ul>"); inList = true; }
      out.push(`<li>${inline(bullet[1])}</li>`);
      continue;
    }
    if (inList) { out.push("</ul>"); inList = false; }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { const n = h[1].length; out.push(`<h${n}>${inline(h[2])}</h${n}>`); continue; }
    if (line.trim() === "") continue;
    out.push(`<p>${inline(line)}</p>`);
  }
  if (inList) out.push("</ul>");
  return out.join("\n");
}
const inline = s => s
  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
  .replace(/`(.+?)`/g, "<code>$1</code>");

function drawProgress(current, finished) {
  $("progress").classList.remove("hidden");
  $("progress").innerHTML = STAGES.map(([key, label]) => {
    const idx = STAGES.findIndex(s => s[0] === current);
    const mine = STAGES.findIndex(s => s[0] === key);
    let cls = "step", mark = "○";
    if (finished || (idx > -1 && mine < idx)) { cls += " done"; mark = "✓"; }
    else if (key === current) { cls += " active"; mark = "●"; }
    return `<div class="${cls}"><span class="mark">${mark}</span>${label}</div>`;
  }).join("");
}

function showError(msg, stage) {
  $("error").classList.remove("hidden");
  $("error").textContent = stage ? `Failed during "${stage}": ${msg}` : msg;
}

function showResult(r) {
  $("progress").classList.add("hidden");
  const bits = [r.uploader, r.duration ? `${Math.round(r.duration/60)} min` : null]
    .filter(Boolean).join(" · ");
  $("out").classList.remove("hidden");
  $("out").innerHTML =
    `<div id="meta">${bits || ""}${bits ? " · " : ""}<a href="${r.url}">source</a> · saved to <code>${r.path}</code></div>` +
    renderMarkdown(r.markdown) +
    `<details><summary>Full transcript (${r.transcript.length.toLocaleString()} characters)</summary><pre>${
      r.transcript.replace(/&/g,"&amp;").replace(/</g,"&lt;")
    }</pre></details>`;
}

function poll(jobId) {
  timer = setInterval(async () => {
    const res = await fetch(`/api/status/${jobId}`);
    const job = await res.json();
    if (job.status === "running") { drawProgress(job.stage, false); return; }
    clearInterval(timer);
    $("go").disabled = false;
    if (job.status === "error") { drawProgress(job.stage, false); showError(job.error, job.failed_stage); }
    else { drawProgress(null, true); showResult(job.result); }
  }, 700);
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  clearInterval(timer);
  $("error").classList.add("hidden");
  $("out").classList.add("hidden");
  $("go").disabled = true;
  drawProgress(null, false);

  const res = await fetch("/api/parse", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url: $("url").value }),
  });
  const data = await res.json();
  if (!res.ok) { $("go").disabled = false; showError(data.error); return; }
  poll(data.job_id);
});
</script>
</body>
</html>
